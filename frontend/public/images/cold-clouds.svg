<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <radialGradient id="cloud"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".4" stop-color="#fff" stop-opacity=".8"/><stop offset=".75" stop-color="#f4fdff" stop-opacity=".35"/><stop offset="1" stop-color="#f4fdff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
