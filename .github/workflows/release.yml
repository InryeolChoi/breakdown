name: Release images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify_images:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Build frontend and backend for the production architecture
        run: |
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$RELEASE_SHA" -t "breakground-frontend:$RELEASE_SHA" frontend
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$RELEASE_SHA" -t "breakground-backend:$RELEASE_SHA" .
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: breakground-frontend:${{ env.RELEASE_SHA }}
          severity: CRITICAL
          exit-code: '1'
          cache: false
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: breakground-backend:${{ env.RELEASE_SHA }}
          severity: CRITICAL
          exit-code: '1'
          cache: false
      - name: Preserve the exact scanned images
        id: archive
        run: |
          set -o pipefail
          docker save "breakground-frontend:$RELEASE_SHA" "breakground-backend:$RELEASE_SHA" | gzip -1 > scanned-images.tar.gz
          sha256sum scanned-images.tar.gz > scanned-images.sha256
          printf 'name=scanned-images-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            scanned-images.tar.gz
            scanned-images.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
    outputs:
      artifact: ${{ steps.archive.outputs.name }}

  publish:
    needs: verify_images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Load the archive from this run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.verify_images.outputs.artifact }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT"
          sha256sum --check scanned-images.sha256
          docker load --input scanned-images.tar.gz
      - name: Publish and record immutable image digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-images.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-manifest
          path: release.json
          if-no-files-found: error
          retention-days: 90
