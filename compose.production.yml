name: breakground-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      BREAKGROUND_SITE: ${BREAKGROUND_SITE:?Set the site address}
      BREAKGROUND_TLS: ${BREAKGROUND_TLS:-}
    ports:
      - "${BREAKGROUND_BIND_IP:-0.0.0.0}:${BREAKGROUND_HTTP_PORT:-80}:80"
      - "${BREAKGROUND_BIND_IP:-0.0.0.0}:${BREAKGROUND_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  frontend:
    image: ${BREAKGROUND_FRONTEND_IMAGE:-breakground-frontend:local}
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    networks:
      - web

  backend:
    image: ${BREAKGROUND_BACKEND_IMAGE:-breakground-backend:local}
    build: .
    restart: unless-stopped
    logging: *logging
    environment:
      JAVA_TOOL_OPTIONS: -Xmx384m
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/breakground
      SPRING_DATASOURCE_USERNAME: ${BREAKGROUND_APP_DB_USER:-breakground}
      SPRING_DATASOURCE_PASSWORD: ${BREAKGROUND_APP_DB_PASSWORD:-${BREAKGROUND_DB_PASSWORD}}
      SPRING_FLYWAY_USER: ${BREAKGROUND_FLYWAY_DB_USER:-breakground}
      SPRING_FLYWAY_PASSWORD: ${BREAKGROUND_FLYWAY_DB_PASSWORD:-${BREAKGROUND_DB_PASSWORD}}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - database

  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: breakground
      POSTGRES_USER: breakground
      POSTGRES_PASSWORD: ${BREAKGROUND_DB_PASSWORD:?Set a database password}
    healthcheck:
      test: [CMD, pg_isready, -U, breakground, -d, breakground]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database

networks:
  web:
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
